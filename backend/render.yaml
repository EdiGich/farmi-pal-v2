services:
  - type: web
    name: farmipal-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn farmipal.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: VLLM_BASE_URL
        value: http://129.212.182.12:8000
      - key: VISION_MODEL
        value: Qwen/Qwen2-VL-7B-Instruct
      - key: VISION_MAX_TOKENS
        value: "800"
      - key: VISION_TEMPERATURE
        value: "0.2"
      - key: VISION_TIMEOUT_S
        value: "60"

databases:
  - name: farmipal-db
    databaseName: farmipal
    plan: free
